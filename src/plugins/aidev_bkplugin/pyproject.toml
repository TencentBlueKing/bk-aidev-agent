[project]
name = "aidev-bkplugin"
version = "3.0.0rc56"
description = "AiDev Agent Bkplugin builtin functions"
readme = "readme.md"
requires-python = "<3.12,>=3.11"
dependencies = [
    "aidev-agent>=3.0.0rc56",
    "blueapps>=4.16rc5, <4.17.0",
    "django>=4.2.28,<5.0",
]

[project.optional-dependencies]
opentelemetry = [
    "aidev-agent[opentelemetry]>=2.2.2rc17",
]

[dependency-groups]
dev = [
    "aidev-agent[opentelemetry]>=2.2.2rc28",
    "pytest>=7.4.4,<9",
    "pytest-cov>=4.1.0,<4.2.0",
    "pytest-mock>=3.14.0",
    "pytest-django>=4.7.0,<5.0",
    "djangorestframework>=3.16.1",
]

[tool.pdm.build]
includes = ["aidev_bkplugin"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "-vv --maxfail=2 --disable-pytest-warnings"
testpaths = ["tests"]
