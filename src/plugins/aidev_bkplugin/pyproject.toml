[project]
name = "aidev-bkplugin"
version = "2.0.0b4"
description = "AiDev Agent Bkplugin builtin functions"
readme = "readme.md"
requires-python = ">=3.11.9, <4"
dependencies = [
    "aidev-agent>=2.0.0b4",
    "blueapps>=4.15.1, <5.0",
    "django>=4.2.28,<5.0",
]


[tool.pdm.build]
includes = ["aidev_bkplugin"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
