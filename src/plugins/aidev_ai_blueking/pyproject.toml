[project]
name = "aidev-ai-blueking"
version = "3.1.0"
description = "小鲸静态资源包"
readme = "readme.md"
requires-python = ">=3.11.9, <4"
dependencies = [
    "aidev-agent>=3.1.0",
    "django>=4.2.28,<5.0",
]


[tool.pdm.build]
includes = ["aidev_ai_blueking"]

[tool.uv]
override-dependencies = ["mcp>=1.30.0,<2.0"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
