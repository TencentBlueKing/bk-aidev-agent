[project]
name = "aidev-agent-adapter"
version = "0.1.0"
description = "AIDev configuration sync and ACP to AG-UI adapter"
readme = "readme.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "agent-client-protocol>=0.12.1,<0.13",
  "ag-ui-protocol>=0.1.10,<0.2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "pytest-asyncio>=0.24,<1", "ruff>=0.14,<0.15"]
[project.scripts]
aidev-agent-adapter = "aidev_agent_adapter.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["aidev_agent_adapter"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
