[project]
authors = [
    {name = "blueking"},
]
license = {text = "MIT"}
requires-python = "<3.12,>=3.11"
dependencies = [
    "environs<15.0.0,>=14.1.0",
    "langchain>=1.1.0",
    "langgraph>=1.0.0",
    "langchain-openai<1.0.0,>=0.3.0",
    "pyro4<5.0,>=4.82",
    "bkapi-client-core<2.0.0,>=1.2.0",
    "jinja2<4.0.0,>=3.1.6",
    "cachetools<6.0.0,>=5.5.2",
    "asgiref<4.0.0,>=3.8.1",
    "werkzeug<4.0.0,>=3.1.3",
    "pytz<2026.0,>=2025.2",
    "h11==0.16.0",
    "langchain-mcp-adapters==0.1.12",
    "langchain-core>1.1.3",
    "mcp==1.25.0",
    "urllib3>=2.6.3",
    "ag-ui-protocol>=0.1.10",
    "typing-extensions>=4.0.0",
    "pika>=1.3.0",
    "langchain-classic>=1.0.1",
    "wrapt>1,<2",
    "json-repair>=0.58.6",
    "bashlex>=0.18,<1.0.0",
    "e2b>=2.20.0",
    "e2b-code-interpreter>=2.6.0",
    "requests>=2.28.0",
    "redis>=5.3.1,<6.0.0",
    "rstream>=0.40.1,<1.0.0",
]
name = "aidev-agent"
version = "2.2.1rc290"
description = "bkaidev agent builder"

[project.optional-dependencies]
# OpenTelemetry 可选 extras：
#   pip install aidev-agent[opentelemetry]
# 版本与 template/{{cookiecutter.project_name}}/pyproject.toml 中的 OTel 版本组合对齐，
# 保证导入 aidev_agent.packages.opentelemetry 子包时无跨主版本不兼容。
opentelemetry = [
    "opentelemetry-api==1.33.1",
    "opentelemetry-sdk==1.33.1",
    "opentelemetry-exporter-otlp==1.33.1",
    "opentelemetry-exporter-otlp-proto-common==1.33.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.33.1",
    "opentelemetry-exporter-otlp-proto-http==1.33.1",
    "opentelemetry-instrumentation==0.54b1",
    "opentelemetry-instrumentation-httpx==0.54b1",
    "opentelemetry-instrumentation-threading==0.54b1",
    "opentelemetry-instrumentation-langchain==0.38.10",
    "opentelemetry-semantic-conventions==0.54b1",
    "opentelemetry-semantic-conventions-ai==0.4.3",
]

[dependency-groups]
dev = [
    "ipdb<0.14.0,>=0.13.13",
    "pytest<7.5.0,>=7.4.4",
    "pytest-asyncio<0.24.0,>=0.23.3",
    "pytest-env<1.2.0,>=1.1.3",
    "pytest-cov<4.2.0,>=4.1.0",
    "pytest-timeout==2.3.1",
    "pre-commit==4.0.1",
    "faker>=37.0.0,<38.0.0",
    "pytest-mock<4.0.0,>=3.14.0",
    "pytest-dotenv<1.0.0,>=0.5.2",
    "pytest-xdist<4.0.0,>=3.5.0",
    "responses<1.0.0,>=0.25.0",
    "loguru>=0.7.3",
]

[tool.pdm.build]
includes = ["aidev_agent"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
exclude = ["*/config/", "*/migrations/"]
force-exclude = true
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "PIE", "PERF", "SIM"]
ignore = ["PERF401", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
# 总是显式制定 import section 的顺序
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
relative-imports-order = "closest-to-furthest"

[tool.pytest.ini_options]
timeout = 60
env_override_existing_values = 1
env_files = [".env"]
asyncio_default_fixture_loop_scope = "session"
addopts = "-vvv --maxfail=2 -s"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as E2E requiring real API credentials (deselect with '-m \"not e2e\"')"
]

[tool.pyright]
venvPath = "."
venv = ".venv"
