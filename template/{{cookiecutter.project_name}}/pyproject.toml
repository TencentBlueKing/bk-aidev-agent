[project]
name = "ai-plugin"
version = "2.2.1rc290"
description = ""
readme = "readme.md"
authors = [{ name = "blueking" }]
requires-python = "~=3.11.9"
dependencies = [
    "aidev-agent[opentelemetry]==2.2.1rc290",
    "aidev-bkplugin==2.2.1rc290",
    "aidev-wxbot==2.2.1rc290",
    "aidev-ai-blueking==2.2.2b3",
    "bk-plugin-framework==2.3.15",
    "bkapi-bk-apigateway==1.0.12",
    "celery==5.4.0",
    "django-celery-beat==2.7.0",
    "django-celery-results==2.5.1",
    "gunicorn==23.0.0",
    "opentelemetry-instrumentation-celery==0.54b1",
    "opentelemetry-instrumentation-dbapi==0.54b1",
    "opentelemetry-instrumentation-django==0.54b1",
    "opentelemetry-instrumentation-logging==0.54b1",
    "opentelemetry-instrumentation-redis==0.54b1",
    "opentelemetry-util-http==0.54b1",
    "tiktoken==0.11.0",
    "langchain-community>=0.4.1",
    "django>=4.2.28,<5.0",
    "drf-yasg==1.21.11",
]

[tool.pdm.build]
includes = ["aidev"]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "bk-plugin-runtime",
    "ipdb<0.14.0,>=0.13.13",
    "pre-commit==4.0.1",
]

[tool.ruff]
exclude = [
    "*/config/",
    "*/migrations/",
]
force-exclude = true
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "PIE",
    "PERF"
]
ignore = ["PERF401", "E501", "E402"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
# 总是显式制定 import section 的顺序
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
relative-imports-order = "closest-to-furthest"
