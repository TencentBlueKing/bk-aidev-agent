specVersion: 3
modules:
  - name: default
    isDefault: true
    language: python
    spec:
      hooks:
        preRelease:
          procCommand: "/app/.venv/bin/python /app/deploy/craw-pre-release.py"
      configuration:
        env:
          - name: PYTHONPATH
            value: /app
            description: ADD PYTHONPATH
          - name: BK_APP_CONFIG_PATH
            value: bk_plugin_runtime.config
            description: app config path
          - name: DJANGO_SETTINGS_MODULE
            value: bk_plugin.patch.plugin
            description: django settings module
          # BK_APIGW_MANAGER_URL_TMPL / BK_APIGW_MANAGER_MAINTAINERS /
          # BK_INIT_SUPERUSER are injected by AIDEV when the PaaS app is created.
          - name: BK_SOPS_APP_CODE
            value: bksops
            description: bk-sops app code
          - name: BK_APIGW_CORS_ALLOW_ORIGINS
            value: "**"
            description: apigw cors strategie allow origins
          - name: BK_APIGW_CORS_ALLOW_METHODS
            value: "**"
            description: apigw cors strategie allow methods
          - name: BK_APIGW_CORS_ALLOW_HEADERS
            value: "**"
            description: apigw cors strategie allow headers
          - name: DJANGO_ALLOW_ASYNC_UNSAFE
            value: "True"
            description: set django allow unsafe async
          # AIDEV_GATEWAY_NAME / BK_APIGW_STAGE / BK_APIGW_GRANTED_APPS /
          # BKAI_AIDEV_APP_UPSTREAM_ORIGIN are injected by AIDEV at app creation.
          - name: BK_APIGW_DEFAULT_TIMEOUT
            value: "300"
            description: default apigw timeout
          - name: BKAPP_OTEL_SAMPLER
            value: "always_on"
            description: otel sampler
          - name: ENABLE_METRICS
            value: "True"
            description: enable metrics
          - name: BKAI_AGENT_APM_OTEL_ENABLED
            value: "False"
            description: craw runtime keeps APM auto instrumentation disabled

          - name: MESSAGE_HANDLER_TYPE
            value: "inmemory"
            description: single-replica craw runtime; switch to rabbitmq before multi-replica
          - name: BKAI_CRAW_BACKEND
            value: "openclaw"
            description: CHAT takeover; unset to keep native ReAct
          - name: BKAI_CRAW_API_URL
            value: "http://127.0.0.1:18789"
            description: local craw gateway; do not point this at an environment-specific hostname
          - name: BKAI_OPENCLAW_MODE
            value: "paas"
            description: craw kernel process mode
          - name: BKAI_OPENCLAW_HTTP_API
            value: "1"
            description: enable OpenAI-compatible chat completions endpoint
          - name: BKAI_OPENCLAW_TRANSPORT
            value: "ws"
            description: gateway WebSocket transport exposes AG-UI tool events
          - name: OPENCLAW_GATEWAY_PORT
            value: "18789"
            description: craw gateway listen port
          - name: BKAI_MCP_EGRESS_PORT
            value: "18787"
            description: loopback MCP egress for per-user access_token
          - name: BKAI_MCP_EGRESS_URL
            value: "http://127.0.0.1:18787"
            description: craw chat leases this egress before talking to the kernel
          - name: BKAI_BKAPI_USE_USER_TOKEN
            value: "0"
            description: user token is for MCP egress only, not bkapi client
      processes:
        - name: web
          procCommand: tini -- bash /app/deploy/craw-supervisor.sh /app/.venv/bin/gunicorn bk_plugin_runtime.wsgi --bind 0.0.0.0:5000 --timeout 300 -k gthread -w 1 --threads 32 --max-requests 512 --max-requests-jitter 50 --backlog 512
          resQuotaPlan: 4C4G
          replicas: 1
          services:
            - name: web
              protocol: TCP
              exposedType:
                name: bk/http
              targetPort: 5000
              port: 80
