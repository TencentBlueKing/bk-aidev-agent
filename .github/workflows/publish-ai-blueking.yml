name: Publish ai-blueking

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 2.1.0-beta.5），留空则自动 patch 自增"
        required: false
        type: string
        default: ""
      target_branch:
        description: "推送目标分支（仅手动触发有效）"
        required: false
        type: string
        default: "2.0.0"
      publish_chat_x:
        description: "同时发布 chat-x"
        required: false
        type: boolean
        default: true
      publish_chat_helper:
        description: "同时发布 chat-helper"
        required: false
        type: boolean
        default: true
      chat_x_version:
        description: "chat-x 版本号（留空则自动 patch 自增）"
        required: false
        type: string
        default: ""
      chat_helper_version:
        description: "chat-helper 版本号（留空则自动 patch 自增）"
        required: false
        type: string
        default: ""
      npm_tag:
        description: "npm dist-tag 覆盖，作用于本次所有包（留空则各自按版本号解析）"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.target_branch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "src/frontend/**/pnpm-lock.yaml"
          registry-url: https://registry.npmjs.org/

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend dependencies
        working-directory: src/frontend/ai-blueking
        run: pnpm install --no-frozen-lockfile

      # ---- 1. 先完成所有 bump（子包按勾选条件执行），确保 workspace 版本在 build 前就位 ----
      - name: Bump chat-x
        id: bump-chatx
        if: ${{ inputs.publish_chat_x }}
        working-directory: src/frontend/ai-blueking
        run: node scripts/bump-version.mjs packages/chat-x "${{ inputs.chat_x_version }}" "${{ inputs.npm_tag }}" >> "$GITHUB_OUTPUT"

      - name: Bump chat-helper
        id: bump-helper
        if: ${{ inputs.publish_chat_helper }}
        working-directory: src/frontend/ai-blueking
        run: node scripts/bump-version.mjs packages/chat-helper "${{ inputs.chat_helper_version }}" "${{ inputs.npm_tag }}" >> "$GITHUB_OUTPUT"

      - name: Bump ai-blueking
        id: bump-version
        working-directory: src/frontend/ai-blueking
        run: node scripts/bump-version.mjs packages/ai-blueking "${{ inputs.version }}" "${{ inputs.npm_tag }}" >> "$GITHUB_OUTPUT"

      # ---- 2. 无条件构建三个包（ai-blueking 依赖 chat-x/chat-helper 的 dist；未勾选发布也需要它们的构建产物） ----
      - name: Build chat-x
        working-directory: src/frontend/ai-blueking
        run: pnpm --filter @blueking/chat-x build

      - name: Build chat-helper
        working-directory: src/frontend/ai-blueking
        run: pnpm --filter @blueking/chat-helper build

      - name: Build ai-blueking
        working-directory: src/frontend/ai-blueking
        run: pnpm --filter @blueking/ai-blueking build

      # ---- 3. 条件发布子包 ----
      - name: Publish chat-x to npm
        if: ${{ inputs.publish_chat_x }}
        working-directory: src/frontend/ai-blueking/packages/chat-x
        run: pnpm publish --no-git-checks --access public --tag ${{ steps.bump-chatx.outputs.npm_tag }}

      - name: Publish chat-helper to npm
        if: ${{ inputs.publish_chat_helper }}
        working-directory: src/frontend/ai-blueking/packages/chat-helper
        run: pnpm publish --no-git-checks --access public --tag ${{ steps.bump-helper.outputs.npm_tag }}

      # ---- 4. 校验 workspace 依赖已在 npm（含刚发布的包，带 registry 传播重试） ----
      - name: Verify workspace dependencies are published
        working-directory: src/frontend/ai-blueking/packages/ai-blueking
        run: |
          set -eo pipefail
          # pnpm publish 会将 workspace:* 替换为本地 package.json 中的版本号，但不检查是否已发布。
          # 刚发布的包在 npm registry 有数秒可见延迟，这里带重试。
          node -e '
            const pkg = require("./package.json");
            const deps = { ...pkg.dependencies, ...pkg.devDependencies, ...pkg.peerDependencies };
            for (const [name, version] of Object.entries(deps)) {
              if (version.startsWith("workspace:")) {
                const depPkg = require("../" + name.split("/").pop() + "/package.json");
                console.log(name + "@" + depPkg.version);
              }
            }
          ' | while IFS='@' read -r name version; do
            echo "Checking ${name}@${version} on npm..."
            ok=""
            for i in 1 2 3 4 5 6; do
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                ok="1"; echo "  ✓ ${name}@${version} exists on npm"; break
              fi
              echo "  … 未可见，等待 registry 传播（第 ${i} 次）"; sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error::${name}@${version} 尚未发布到 npm，请先发布 ${name} 再发布 ai-blueking"
              exit 1
            fi
          done

      # ---- 5. 发布 ai-blueking（workspace:* 已解析到刚 bump 的本地版本） ----
      - name: Publish ai-blueking to npm
        working-directory: src/frontend/ai-blueking/packages/ai-blueking
        # 前置步骤已完成 chat-x、chat-helper、ai-blueking 构建；发布时跳过 prepublishOnly，避免重复构建。
        run: pnpm publish --ignore-scripts --no-git-checks --access public --tag ${{ steps.bump-version.outputs.npm_tag }}

      - name: Convert version to Python format
        id: py-version
        run: |
          NPM_VERSION="${{ steps.bump-version.outputs.version }}"
          # Convert: 2.1.0-beta.4 -> 2.1.0b4, 2.1.0-rc.1 -> 2.1.0rc1, 2.1.0-alpha.1 -> 2.1.0a1
          PY_VERSION=$(echo "$NPM_VERSION" | sed -E 's/-alpha\./a/g; s/-beta\./b/g; s/-rc\./rc/g')
          echo "py_version=$PY_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm version: $NPM_VERSION -> py version: $PY_VERSION"

      - name: Update pyproject.toml version
        working-directory: src/plugins/aidev_ai_blueking
        run: |
          sed -i 's/^version = "[^"]*"/version = "${{ steps.py-version.outputs.py_version }}"/' pyproject.toml
          echo "Updated pyproject.toml:"
          grep '^version' pyproject.toml

      - name: Build aidev-ai-blueking
        run: make build-aidev-ai-blueking

      - name: Publish to PyPI
        working-directory: src/plugins/aidev_ai_blueking
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}

      - name: Update template aidev-ai-blueking version
        run: |
          PY_VERSION="${{ steps.py-version.outputs.py_version }}"
          # 更新 requirements.txt 中的 aidev-ai-blueking 版本
          sed -i "s/^aidev-ai-blueking==.*/aidev-ai-blueking==${PY_VERSION}/" "template/{{cookiecutter.project_name}}/requirements.txt"
          # 更新 pyproject.toml 中的 aidev-ai-blueking 版本
          sed -i "s/\"aidev-ai-blueking==[^\"]*\"/\"aidev-ai-blueking==${PY_VERSION}\"/" "template/{{cookiecutter.project_name}}/pyproject.toml"
          echo "Updated template files:"
          grep 'aidev-ai-blueking' "template/{{cookiecutter.project_name}}/requirements.txt"
          grep 'aidev-ai-blueking' "template/{{cookiecutter.project_name}}/pyproject.toml"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          MSG="chore(release): ai-blueking@${{ steps.bump-version.outputs.version }}"
          if [ "${{ inputs.publish_chat_x }}" = "true" ]; then
            MSG="${MSG}, chat-x@${{ steps.bump-chatx.outputs.version }}"
          fi
          if [ "${{ inputs.publish_chat_helper }}" = "true" ]; then
            MSG="${MSG}, chat-helper@${{ steps.bump-helper.outputs.version }}"
          fi
          MSG="${MSG} [skip ci]"
          git commit -m "${MSG}"
          git push origin HEAD:${{ github.event_name == 'push' && github.ref_name || inputs.target_branch }}
