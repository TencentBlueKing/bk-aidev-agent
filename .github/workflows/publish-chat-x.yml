name: Publish chat-x

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.0），留空则自动 patch 自增"
        required: false
        type: string
        default: ""
      target_branch:
        description: "推送目标分支"
        required: false
        type: string
        default: "2.0.0"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "src/frontend/**/pnpm-lock.yaml"
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        working-directory: src/frontend/ai-blueking
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Bump version
        id: bump-version
        working-directory: src/frontend/ai-blueking/packages/chat-x
        run: |
          resolve_tag() {
            local ver="$1"
            if echo "$ver" | grep -qE -- '-alpha\.'; then echo "alpha"
            elif echo "$ver" | grep -qE -- '-beta\.'; then echo "beta"
            elif echo "$ver" | grep -qE -- '-rc\.'; then echo "rc"
            else echo "latest"
            fi
          }
          if [ -n "${{ inputs.version }}" ]; then
            npm version "${{ inputs.version }}" --no-git-tag-version
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "npm_tag=$(resolve_tag '${{ inputs.version }}')" >> "$GITHUB_OUTPUT"
          else
            CURRENT=$(node -p "require('./package.json').version")
            if echo "$CURRENT" | grep -qE -- '-(alpha|beta|rc)\.'; then
              # 预发布版本：自增预发布号，如 0.1.0-beta.1 -> 0.1.0-beta.2
              PREFIX=$(echo "$CURRENT" | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.)([0-9]+)/\1/')
              NUM=$(echo "$CURRENT" | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.([0-9]+)/\2/')
              NEW_VERSION="${PREFIX}$((NUM + 1))"
              npm version "$NEW_VERSION" --no-git-tag-version
              echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
              echo "npm_tag=$(resolve_tag "$NEW_VERSION")" >> "$GITHUB_OUTPUT"
            else
              echo "::error::当前版本 $CURRENT 是正式版，正式版必须通过手动触发并指定版本号发布"
              exit 1
            fi
          fi
          echo "Publishing version: $(node -p "require('./package.json').version")"

      - name: Build chat-x
        working-directory: src/frontend/ai-blueking
        run: pnpm --filter @blueking/chat-x build

      - name: Publish chat-x to npm
        working-directory: src/frontend/ai-blueking/packages/chat-x
        run: pnpm publish --no-git-checks --access public --tag ${{ steps.bump-version.outputs.npm_tag }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(release): chat-x@${{ steps.bump-version.outputs.version }}"
          git push origin HEAD:${{ inputs.target_branch }}
