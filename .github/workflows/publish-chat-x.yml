name: Publish chat-x

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.0），留空则自动 patch 自增"
        required: false
        type: string
        default: ""
      target_branch:
        description: "推送目标分支"
        required: false
        type: string
        default: "2.0.0"
      npm_tag:
        description: "npm dist-tag 覆盖（留空则按版本号自动解析：beta/rc/latest）"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "src/frontend/**/pnpm-lock.yaml"
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        working-directory: src/frontend/ai-blueking
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Bump version
        id: bump-version
        working-directory: src/frontend/ai-blueking
        run: node scripts/bump-version.mjs packages/chat-x "${{ inputs.version }}" "${{ inputs.npm_tag }}" >> "$GITHUB_OUTPUT"

      - name: Build chat-x
        working-directory: src/frontend/ai-blueking
        run: pnpm --filter @blueking/chat-x build

      - name: Publish chat-x to npm
        working-directory: src/frontend/ai-blueking/packages/chat-x
        run: pnpm publish --no-git-checks --access public --tag ${{ steps.bump-version.outputs.npm_tag }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(release): chat-x@${{ steps.bump-version.outputs.version }}"
          git push origin HEAD:${{ inputs.target_branch }}
